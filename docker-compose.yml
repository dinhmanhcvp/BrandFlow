version: '3.8'

services:
  # ==========================================
  # API WEB SERVER: Bức tường lửa hứng kết nối Frontend
  # ==========================================
  api:
    build: .
    container_name: brandflow_api
    ports:
      - "8000:8000"
    environment:
      # Database connection (SQLite requires a mounted volume, or use remote PostgreSQL)
      - DATABASE_URL=sqlite:///./data/brandflow.db
      # Kho Dữ liệu (DuckDB per-tenant) nằm trong volume để không mất khi recreate container
      - BRANDFLOW_WAREHOUSE_DIR=/app/data/warehouse
      # 1 worker: DuckDB chỉ cho 1 tiến trình ghi mỗi file tenant (xem Dockerfile)
      - WEB_CONCURRENCY=1
      # Frontend URL for CORS
      # - BRANDFLOW_FRONTEND_URLS=http://localhost:3000,http://localhost:3001
      # JWT Secrets
      # - JWT_SECRET_KEY=YOUR_SUPER_SECRET_KEY
    volumes:
      - brandflow_data:/app/data
    # Số worker lấy từ WEB_CONCURRENCY (CMD trong Dockerfile)
    restart: always

volumes:
  brandflow_data:
